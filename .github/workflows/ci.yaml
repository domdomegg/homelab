name: CI/CD

on: push

permissions:
  id-token: write   # mint the GitHub OIDC token used to assume the AWS role
  contents: read

jobs:
  ci_cd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - name: Checkout ${{ github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      # Pinned release, checked against its published checksums before use
      - name: Install Pulumi
        env:
          # renovate: datasource=github-releases depName=pulumi/pulumi
          PULUMI_VERSION: 3.266.0
        run: |
          base=https://github.com/pulumi/pulumi/releases/download/v$PULUMI_VERSION
          file=pulumi-v$PULUMI_VERSION-linux-x64.tar.gz
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/pulumi-$PULUMI_VERSION-checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" -C "$HOME"
          echo "$HOME/pulumi" >> "$GITHUB_PATH"
      - name: Install NPM dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build --if-present
      - name: Test
        run: npm run test --if-present

      - name: Setup WARP for IPv6 connectivity
        if: github.ref == 'refs/heads/master'
        uses: fscarmen/warp-on-actions@37ce1997e075435a827991dabcce1d080c1fe512 # v1.4
      # AWS access via GitHub OIDC federation — no stored AWS keys. Assumes the
      # homelab-ci role defined in aws-shared-infra (grants S3 for Pulumi state +
      # scoped IAM for homelab's app roles / cluster OIDC provider).
      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::338337944728:role/homelab-ci
          aws-region: eu-west-1
      # Build a kubeconfig that authenticates via a GitHub OIDC token instead of
      # the old cluster-admin cert (KUBECONFIG secret). The apiserver trusts
      # this repo's master-ref token (audience homelab-k8s) and maps it to a
      # cluster-admin-bound user (see src/k8s/ciRbac.ts). CA + server are
      # non-secret repo variables; tls-server-name=kubernetes because the cert's
      # SANs don't include home.adamjones.me.
      - name: Configure for deployment
        if: github.ref == 'refs/heads/master'
        run: |
          pulumi login s3://domdomegg-pulumi-backend/homelab

          K8S_TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=homelab-k8s" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')

          # Pin the apiserver host to its AAAA record. WARP gives the runner a
          # ULA IPv6 source (fd01::/8), so Go's RFC 6724 sort puts the A record
          # first, and kubectl/Pulumi dial the Oracle relay on IPv4. The relay
          # only forwards 80/443, but WARP's edge still completes the TCP
          # handshake on 6443, so Go never falls back to IPv6 and stalls with
          # "TLS handshake timeout".
          KUBE_HOST=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.urlparse(sys.argv[1]).hostname)' "$KUBE_SERVER")
          KUBE_AAAA=$(dig +short AAAA "$KUBE_HOST" | grep : | head -n1)
          if [ -z "$KUBE_AAAA" ]; then echo "No AAAA record for $KUBE_HOST"; exit 1; fi
          echo "$KUBE_AAAA $KUBE_HOST" | sudo tee -a /etc/hosts >/dev/null

          mkdir -p ~/.kube
          kubectl config set-cluster homelab --server="$KUBE_SERVER" --tls-server-name=kubernetes >/dev/null
          echo "$KUBE_CA_DATA" | base64 -d > /tmp/k8s-ca.crt
          kubectl config set-cluster homelab --certificate-authority=/tmp/k8s-ca.crt --embed-certs=true >/dev/null
          kubectl config set-credentials github-ci --token="$K8S_TOKEN" >/dev/null
          kubectl config set-context homelab --cluster=homelab --user=github-ci >/dev/null
          kubectl config use-context homelab >/dev/null

          echo "$PROD_ENV" > src/env/prod.ts
        env:
          KUBE_SERVER: ${{ vars.KUBE_SERVER }}
          KUBE_CA_DATA: ${{ vars.KUBE_CA_DATA }}
          PROD_ENV: ${{ secrets.PROD_ENV }}
      - id: later_runs_check
        name: Check for later runs
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          cancel_others: false
          skip_after_successful_duplicate: false
          concurrent_skipping: outdated_runs
      - name: Deploy
        if: ${{ github.ref == 'refs/heads/master' && steps.later_runs_check.outputs.should_skip != 'true' }}
        run: npm run deploy:prod
